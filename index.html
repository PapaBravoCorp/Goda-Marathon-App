<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      These tags are what a crawler that does not run JavaScript reads, and what
      WhatsApp, Slack and X use to build a link preview. src/components/Seo.jsx
      overwrites them per route once React has mounted; these are the fallback
      and the default.

      The absolute URLs below use the production domain. If it ever changes,
      update it here and in public/robots.txt and public/sitemap.xml.
    -->
    <title>GODA Epic Trail Run — Trail running in Nashik</title>
    <meta
      name="description"
      content="GODA Epic Trail Run, organised by Godavari Expedition and G5 Foundation in the Gangapur Backwaters near Nashik. Trail distances for every level, chip timing, finisher medals and full medical support."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Godavari Expedition" />
    <meta name="theme-color" content="#FFFFFF" />

    <!--
      Sets the light or dark theme before the first paint, so the page never
      flashes the wrong one. Mirrors src/utils/theme.js (which cannot be
      imported this early): the visitor's own choice wins, then the admin
      default as last seen, then light. /admin is always dark.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var choice = localStorage.getItem('goda-theme');
          var siteDefault = localStorage.getItem('goda-theme-default');
          if (choice === 'light' || choice === 'dark') theme = choice;
          else if (siteDefault === 'dark') theme = 'dark';
          else if (siteDefault === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) { /* storage blocked: keep light */ }
        if (location.pathname.indexOf('/admin') === 0) theme = 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1626');
        }
      })();
    </script>

    <!--
      Meta Pixel (Facebook and Instagram ads). This only loads the library and
      initialises the pixel. Every event, PageView included, is sent from
      src/utils/analytics.js: this is a single-page app, so a PageView fired
      here would only ever count the first page a visitor opens.

      Not loaded on /admin: organisers and stats viewers are not an audience.
      The ID is public by design; it is in every visitor's browser anyway.
      vercel.json's Content-Security-Policy must allow connect.facebook.net and
      www.facebook.com, or this loads nothing and fails without an error.

      No <noscript> image: the site does not work without JavaScript, so the
      only visitors it would count are bots.
    -->
    <script>
      if (location.pathname.indexOf('/admin') !== 0) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1690222886147383');
      }
    </script>

    <link rel="canonical" href="https://godavariexpedition.in/" />

    <!-- Fonts are loaded via @import in index.css; preconnecting here starts the

    <link rel="preconnect" href="https://fonts.googleapis.com" />
